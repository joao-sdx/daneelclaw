version: '3'

dotenv: [ '.env' ]

tasks:
  yf:test:
    desc: "Login to YetiForce and fetch Contact record c2"
    vars:
      TOKEN:
        sh: |
          http --multipart POST "{{.YETIFORCE_URL}}/webservice/WebserviceStandard/Users/Login" \
            "Authorization:Basic {{.YETIFORCE_BASIC_AUTH}}" \
            "X-API-KEY:{{.YETIFORCE_API_KEY}}" \
            "x-encrypted:0" \
            userName="{{.YETIFORCE_USER}}" \
            password="{{.YETIFORCE_PASSWORD}}" | jq -r '.result.token'
    cmds:
      - cmd: |
          http --multipart POST "{{.YETIFORCE_URL}}/webservice/WebserviceStandard/Users/Login" \
            "Authorization:Basic {{.YETIFORCE_BASIC_AUTH}}" \
            "X-API-KEY:{{.YETIFORCE_API_KEY}}" \
            "x-encrypted:0" \
            userName="{{.YETIFORCE_USER}}" \
            password="{{.YETIFORCE_PASSWORD}}"
      - echo "token={{.TOKEN}}"
      - http GET "{{.YETIFORCE_URL}}/webservice/WebserviceStandard/Contacts/Record/c2" "x-token:{{.TOKEN}}"
