spring:
  application:
    name: daneelclaw
  config:
    import: "optional:file:.env[.properties]"
  ai:
    openai:
      base-url: http://localhost:1234
      api-key: not-needed
      chat:
        options:
          model: ${LMSTUDIO_MODEL:nvidia/nemotron-3-nano-4b}
          
server:
  port: 8080

daneel:
  llm:
    serialize-calls: true  # LMStudio serves one inference at a time; serialize HTTP calls to prevent concurrent-request failures
  tools:
    speak:
      command: "say -v Thomas {text}"
    files:
      root: "./rootdir"
    spawn:
      block-timeout-ms: 30000
    errors:
      ttl-ms: 300000
      sweep-interval-ms: 60000
    dataforseo:
      api:
        user: ${DATAFORSEO_USER}
        key: ${DATAFORSEO_KEY}
  scheduler:
    tasks-dir: "./tasks"
    check-interval-ms: 60000
  chat:
    compact:
      char-threshold: 8000
      keep-last-messages: 4
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    allowed-chat-ids: ${TELEGRAM_ALLOWED_CHAT_IDS:}
    poll-delay-ms: 1000

logging:
  level:
    root: INFO
    org.daneel: DEBUG
