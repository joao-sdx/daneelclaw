spring:
  application:
    name: daneelclaw
  ai:
    openai:
      base-url: http://localhost:1234
      api-key: not-needed
      chat:
        options:
          model: ${LMSTUDIO_MODEL:local-model}

server:
  port: 8080

daneel:
  tools:
    speak:
      command: "say -v Thomas {text}"
  scheduler:
    tasks-dir: "./tasks"
    check-interval-ms: 60000
